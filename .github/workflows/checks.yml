name: 全量自检

# 知时 · 每次 push / PR 跑一遍全量守卫（27 个脚本，含真渲染 / 真点击 / 逻辑实跑）。
# 不触发大模型调用，不产生费用；云端 SDK 只安装不调用。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 Python 与 python-docx
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet python-docx

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 一键全量自检（含两版 zip 交叉校验，未打包时自动跳过）
        run: npm run checks
