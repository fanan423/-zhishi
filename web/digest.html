<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浓缩 + 溯源 · 真正智能的阅读 | 知时</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;
    --text:#e8eaed;--sub:#9aa4b2;--accent:#4dd6a8;--accent2:#5b9cf8;
    --warn:#f5a524;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 20% -10%,#1a2432 0%,var(--bg) 55%);
    color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.75;min-height:100vh;padding:26px 20px 60px}
  .wrap{max-width:1140px;margin:0 auto}
  h1{font-size:20px;letter-spacing:.5px}
  .sub{font-size:13px;color:var(--sub);margin-top:5px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 6px}
  select,button{font-family:inherit;font-size:13px;border-radius:9px;padding:9px 14px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  button.primary{background:linear-gradient(135deg,var(--accent),#38b98f);color:#07120d;border:none;font-weight:600}
  button:hover{border-color:var(--accent)}
  .meta{font-size:12px;color:var(--sub);margin-left:auto}
  .meta b{color:var(--accent)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h2{font-size:13.5px;color:var(--accent);letter-spacing:.5px;margin-bottom:12px;
    display:flex;justify-content:space-between;align-items:center}
  .card h2 small{font-size:11px;color:var(--sub);font-weight:400}

  /* 原文 */
  .raw{font-size:13.5px;line-height:2;color:#c8d0db;white-space:pre-wrap;
    max-height:560px;overflow-y:auto;padding-right:6px}
  .q{background:rgba(245,165,36,.14);border-bottom:1px solid rgba(245,165,36,.35);
    border-radius:3px;padding:1px 2px;transition:.3s;cursor:pointer}
  .q:hover{background:rgba(245,165,36,.28)}
  .q.on{background:rgba(77,214,168,.25);border-bottom-color:var(--accent);color:#bdf5e1}

  /* 浓缩 */
  .digest-line{font-size:15px;font-weight:600;line-height:1.7;padding:12px 14px;
    background:linear-gradient(90deg,rgba(77,214,168,.10),transparent);
    border-left:3px solid var(--accent);border-radius:8px;margin-bottom:14px}
  .digest-line .lab{font-size:11px;color:var(--sub);display:block;letter-spacing:.5px;font-weight:400;margin-bottom:3px}

  .pt{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;
    background:var(--panel2);transition:.28s;cursor:pointer;position:relative}
  .pt:hover{border-color:rgba(77,214,168,.5)}
  .pt.on{border-color:var(--accent);background:linear-gradient(90deg,rgba(77,214,168,.09),var(--panel2))}
  .pt .num{position:absolute;left:-1px;top:-1px;font-size:10px;color:var(--accent);
    background:var(--panel2);border:1px solid var(--line);border-radius:9px 0 9px 0;padding:1px 7px}
  .pt .main{font-size:13.5px;line-height:1.7;padding-left:18px}
  .pt .src{font-size:11.5px;color:var(--sub);margin-top:8px;padding-left:18px;display:none}
  .pt.on .src{display:block;animation:fade .3s}
  .pt .src b{color:var(--warn)}
  .pt .src .qq{color:#c8d0db;font-style:italic}

  .hint{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.8;
    border-left:3px solid var(--accent2);padding-left:13px}
  .hint b{color:var(--accent)}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap;margin-bottom:14px}
  .topbar a{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:600;
    border:1px solid rgba(77,214,168,.35);border-radius:9px;padding:7px 16px}
  .topbar a:hover{background:rgba(77,214,168,.08);border-color:var(--accent)}
  .topbar span{font-size:12px;color:var(--sub);letter-spacing:1px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(max-width:880px){.cols{grid-template-columns:1fr}.raw{max-height:300px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="overview.html">← 返回项目总览</a>
    <span>DEMO 02 · 浓缩 + 溯源</span>
  </div>
  <h1>浓缩 + 溯源 · 真正智能的阅读</h1>
  <div class="sub">不只"抓通知"，而是<b style="color:var(--accent)">读懂后重写</b>，且每一句都能点回原文核对</div>

  <div class="toolbar">
    <select id="picker"></select>
    <button class="primary" id="toggle">一键高亮全部出处</button>
    <span class="meta">点击右侧任一条浓缩 → 左侧原文<b>自动定位高亮</b></span>
  </div>

  <div class="cols">
    <div class="card">
      <h2>📄 原文（采集自公开页面）<small id="srcLabel"></small></h2>
      <div class="raw" id="raw"></div>
    </div>
    <div class="card">
      <h2>✨ AI 浓缩版 <small>每句可溯源</small></h2>
      <div id="digest"></div>
    </div>
  </div>

  <div class="hint">
    <b>这一页回答的正是"这就是数智安农翻版吗"的质疑：</b><br>
    搬运信息谁都会——数智安农能列出通知原文，普通爬虫也能。但"知时"做的是<b>理解后重构</b>：
    把 800 字通知压成 3 句人话，同时<b>每个结论都挂着原文出处</b>，点一下就能核对，杜绝 AI 胡说。<br>
    这叫<b>可信的智能</b>——不是"我读给你听"，是"我读完告诉你重点，且你能查证"。
  </div>
</div>

const $ = id => document.getElementById(id);
let current = null;

/* 下拉：只放有浓缩数据的 */
const KEYS = Object.keys(DATA);
const LABEL = {"t2026-1103-000":"农芯智AI大赛通知（真实数据）","t2026-1103-001":"转专业工作通知","t2026-1103-002":"正大杯网考通知","t2026-1103-004":"奖助学金材料补交","t2026-1103-005":"期中考试安排"};
const sel = $("picker");
KEYS.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=LABEL[k]||k;sel.appendChild(o);});

/* 把原文中引用的句子包成可高亮 span */
function renderRaw(d){
  let html = d.raw;
  d.points.forEach((p,i)=>{
    // 转义后做包含替换（quote 是原文子串）
    if(html.includes(p.quote)){
      html = html.replace(p.quote, `<span class="q" data-i="${i}">${p.quote}</span>`);
    }else{
      // 找不到完全匹配时，尝试用前半段匹配
      const head = p.quote.slice(0, Math.min(18, p.quote.length));
      if(html.includes(head)){
        html = html.replace(head, `<span class="q" data-i="${i}">${head}</span>`);
      }
    }
  });
  return html;
}

function render(k){
  current = k;
  const d = DATA[k];
  $("srcLabel").textContent = "来源：" + d.src;
  $("raw").innerHTML = renderRaw(d);

  const box = $("digest");
  box.innerHTML = `
    <div class="digest-line"><span class="lab">一句话读懂</span>${d.one}</div>
    ${d.points.map((p,i)=>`
      <div class="pt" data-i="${i}">
        <span class="num">要点 ${i+1}</span>
        <div class="main">${p.text}</div>
        <div class="src">📌 原文出处：<span class="qq">「${p.quote}」</span></div>
      </div>`).join("")}
  `;

  // 右侧点击 → 左侧高亮
  box.querySelectorAll(".pt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const i = el.dataset.i;
      box.querySelectorAll(".pt").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      const q = document.querySelector(`.q[data-i="${i}"]`);
      document.querySelectorAll(".q").forEach(x=>x.classList.remove("on"));
      if(q){
        q.classList.add("on");
        q.scrollIntoView({block:"center", behavior:"smooth"});
      }
    });
  });

  // 左侧点击 → 右侧高亮
  $("raw").querySelectorAll(".q").forEach(el=>{
    el.addEventListener("click", ()=>{
      const i = el.dataset.i;
      $("raw").querySelectorAll(".q").forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      const pt = document.querySelector(`.pt[data-i="${i}"]`);
      box.querySelectorAll(".pt").forEach(x=>x.classList.remove("on"));
      if(pt){ pt.classList.add("on"); pt.scrollIntoView({block:"center", behavior:"smooth"}); }
    });
  });
}

/* 一键高亮全部 */
let allOn = false;
$("toggle").addEventListener("click", ()=>{
  allOn = !allOn;
  document.querySelectorAll(".q").forEach(x=> x.classList.toggle("on", allOn));
  $("toggle").textContent = allOn ? "取消高亮" : "一键高亮全部出处";
});

sel.addEventListener("change", ()=> render(sel.value));
render(KEYS[0]);
</script>
